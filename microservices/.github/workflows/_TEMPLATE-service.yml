# Copy to <service-name>.yml and replace every SERVICE_NAME. GitHub still parses this
# file in place, so rename on copy rather than editing it here.
name: CI / SERVICE_NAME

on:
  push:
    branches: [main, master]
    paths:
      - 'SERVICE_NAME/**'
      - '.github/workflows/SERVICE_NAME.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'SERVICE_NAME/**'
      - '.github/workflows/SERVICE_NAME.yml'
  workflow_dispatch:
    inputs:
      runner_label:
        description: Self-hosted runner label
        type: string
        default: private-gcp-runner
      sonar_scan:
        description: Override SonarQube scan (blank = use build_config.json)
        type: choice
        options: ['', 'true', 'false']
        default: ''

concurrency:
  group: ci-SERVICE_NAME-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    uses: banking-factory/platform-ci/.github/workflows/ci.yml@v1
    with:
      service_path: SERVICE_NAME
      runner_label: ${{ inputs.runner_label || 'private-gcp-runner' }}
      sonar_scan: ${{ inputs.sonar_scan || '' }}
    secrets: inherit
