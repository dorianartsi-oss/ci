# Copy to /.github/workflows/SERVICE_NAME.yml (repo root — GitHub only discovers
# workflows there) and replace every SERVICE_NAME. Kept outside .github/workflows
# so GitHub does not try to run the template itself.
name: CI / SERVICE_NAME

on:
  push:
    branches: [main, master]
    paths:
      - 'microservices/SERVICE_NAME/**'
      - 'platform-ci/**'
      - 'quality-gates/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/SERVICE_NAME.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'microservices/SERVICE_NAME/**'
      - 'platform-ci/**'
      - 'quality-gates/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/SERVICE_NAME.yml'
  workflow_dispatch:
    inputs:
      runner_label:
        description: Runner label (ubuntu-latest until private-gcp-runner is attached)
        type: string
        default: ubuntu-latest
      sonar_scan:
        description: Override SonarQube scan (blank = use build_config.json)
        type: choice
        options: ['', 'true', 'false']
        default: ''

concurrency:
  group: ci-SERVICE_NAME-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  pages: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      service_path: microservices/SERVICE_NAME
      gates_path: service/quality-gates/gates
      runner_label: ${{ inputs.runner_label || 'ubuntu-latest' }}
      sonar_scan: ${{ inputs.sonar_scan || '' }}
    secrets: inherit