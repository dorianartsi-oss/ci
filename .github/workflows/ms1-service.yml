name: CI / ms1

on:
  push:
    branches: [main, master]
    paths:
      - 'microservices/ms1/**'
      - 'platform-ci/**'
      - 'quality-gates/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/ms1-service.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'microservices/ms1/**'
      - 'platform-ci/**'
      - 'quality-gates/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/ms1-service.yml'
  workflow_dispatch:
    inputs:
      runner_label:
        description: Runner label (ubuntu-latest until private-gcp-runner is attached)
        type: string
        default: ubuntu-latest
      sonar_scan:
        description: Override SonarQube scan (blank = use build_config.json)
        type: choice
        options: ['', 'true', 'false']
        default: ''

concurrency:
  group: ci-ms1-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  pages: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      service_path: microservices/ms1
      gates_path: service/quality-gates/gates
      runner_label: ${{ inputs.runner_label || 'ubuntu-latest' }}
      sonar_scan: ${{ inputs.sonar_scan || '' }}
    secrets: inherit