name: Java + Docker CI

on:
  workflow_call:
    inputs:
      service_path:
        description: Path to the service directory inside the calling repository.
        type: string
        required: true
      runner_label:
        description: Label of the self-hosted runner pool to execute on.
        type: string
        required: false
        default: private-gcp-runner
      sonar_scan:
        description: "'true'/'false' to override scan.sonar_scan; blank uses build_config.json."
        type: string
        required: false
        default: ''
      gates_repo:
        description: Repository holding the central quality-gate thresholds.
        type: string
        required: false
        default: banking-factory/quality-gates
      gates_ref:
        description: Ref of the quality-gates repository to read.
        type: string
        required: false
        default: main
      gates_path:
        description: >
          Workspace-relative directory holding gates/*.json. When set, the gates
          repository is read locally instead of being cloned from gates_repo.
        type: string
        required: false
        default: ''
      platform_ref:
        description: Ref of banking-factory/platform-ci supplying the composite actions.
        type: string
        required: false
        default: v1
      jfrog_cli_download_repo:
        description: >
          Artifactory remote repository mirroring releases.jfrog.io, used to fetch the
          JFrog CLI. Blank downloads it from the public internet.
        type: string
        required: false
        default: ''

    secrets:
      ARTIFACTORY_USERNAME:
        description: Required in the banking-factory org. Optional here so the run reaches the JFrog steps instead of failing validation.
        required: false
      ARTIFACTORY_TOKEN:
        description: Required in the banking-factory org. Optional here so the run reaches the JFrog steps instead of failing validation.
        required: false
      ARTIFACTORY_URL:
        description: Full Artifactory base URL. Derived from registry.host when unset.
        required: false
      PLATFORM_REPO_TOKEN:
        description: Read access to platform-ci and quality-gates. Falls back to GITHUB_TOKEN.
        required: false
      SONAR_HOST_URL:
        required: false
      SONAR_TOKEN:
        required: false
      PORT_CLIENT_ID:
        required: false
      PORT_CLIENT_SECRET:
        required: false
      SMTP_SERVER:
        required: false
      SMTP_USERNAME:
        required: false
      SMTP_PASSWORD:
        required: false
      SMTP_FROM:
        required: false

    outputs:
      images:
        description: Comma-separated list of images this run pushed.
        value: ${{ jobs.config.outputs.images }}
      config:
        description: The effective, fully merged build configuration.
        value: ${{ jobs.config.outputs.config }}

permissions:
  contents: read
  id-token: write

jobs:
  config:
    name: Resolve config
    runs-on: ${{ inputs.runner_label }}
    env:
      PLATFORM_TOKEN: ${{ secrets.PLATFORM_REPO_TOKEN || github.token }}
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
      config: ${{ steps.resolve.outputs.config }}
      cmdb_code: ${{ steps.resolve.outputs.cmdb_code }}
      module_name: ${{ steps.resolve.outputs.module_name }}
      sonar_scan: ${{ steps.resolve.outputs.sonar_scan }}
      enable_quality_gate: ${{ steps.resolve.outputs.enable_quality_gate }}
      force_continue_on_scan_failure: ${{ steps.resolve.outputs.force_continue_on_scan_failure }}
      min_coverage: ${{ steps.resolve.outputs.min_coverage }}
      fail_on_test_failure: ${{ steps.resolve.outputs.fail_on_test_failure }}
      notify_email: ${{ steps.resolve.outputs.notify_email }}
      github_pages: ${{ steps.resolve.outputs.github_pages }}
      port_enabled: ${{ steps.resolve.outputs.port_enabled }}
      port_blueprint: ${{ steps.resolve.outputs.port_blueprint }}
      recipients: ${{ steps.resolve.outputs.recipients }}
      registry_host: ${{ steps.resolve.outputs.registry_host }}
      docker_repo: ${{ steps.resolve.outputs.docker_repo }}
      maven_repo: ${{ steps.resolve.outputs.maven_repo }}
      images: ${{ steps.resolve.outputs.images }}
      gates_source: ${{ steps.gates.outputs.source }}
      started_at: ${{ steps.clock.outputs.epoch }}

    steps:
      - name: Record start time
        id: clock
        shell: bash
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Check out the service repository
        uses: actions/checkout@v4
        with:
          path: service
          fetch-depth: 1

      - name: Locate build_config.json
        id: cfg
        shell: bash
        env:
          SERVICE_PATH: ${{ inputs.service_path }}
        run: |
          set -euo pipefail
          file="service/${SERVICE_PATH%/}/build_config.json"
          if [[ ! -f "$file" ]]; then
            echo "::error::$file not found. Every service must ship a build_config.json."
            exit 1
          fi
          jq empty "$file" || { echo "::error::$file is not valid JSON"; exit 1; }
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "cmdb_code=$(jq -r '.cmdb_code // "unknown"' "$file")" >> "$GITHUB_OUTPUT"

      - name: Resolve quality gates
        id: gates
        uses: ./service/platform-ci/actions/quality-gates
        with:
          cmdb_code: ${{ steps.cfg.outputs.cmdb_code }}
          gates_repo: ${{ inputs.gates_repo }}
          gates_ref: ${{ inputs.gates_ref }}
          gates_path: ${{ inputs.gates_path }}
          token: ${{ env.PLATFORM_TOKEN }}

      - name: Merge configuration
        id: resolve
        uses: ./service/platform-ci/actions/resolve-config
        with:
          config_file: ${{ steps.cfg.outputs.file }}
          gates_json: ${{ steps.gates.outputs.gates_json }}
          sonar_scan: ${{ inputs.sonar_scan }}

  build:
    name: Build ${{ matrix.name }}
    needs: config
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.config.outputs.matrix) }}

    env:
      PROJECT_DIR: service/${{ inputs.service_path }}/${{ matrix.path }}
      IMAGE_REF: ${{ matrix.image_base }}:${{ github.run_number }}
      JF_URL: ${{ secrets.ARTIFACTORY_URL || format('https://{0}/artifactory', needs.config.outputs.registry_host) }}
      JFROG_CLI_BUILD_NAME: ${{ inputs.service_path }}-${{ matrix.name }}
      JFROG_CLI_BUILD_NUMBER: ${{ github.run_number }}
      MAVEN_LOG: ${{ github.workspace }}/maven_build_output.txt

    steps:
      - name: Check out the service repository
        uses: actions/checkout@v4
        with:
          path: service
          fetch-depth: 0

      - name: Prepare the workspace
        uses: ./service/platform-ci/actions/prepare-workspace
        with:
          project_dir: ${{ env.PROJECT_DIR }}
          maven_log: ${{ env.MAVEN_LOG }}

      - name: Set up JDK ${{ matrix.jdk_version }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk_version }}
          cache: maven

      - name: Set up Artifactory
        uses: ./service/platform-ci/actions/setup-artifactory
        with:
          jf_url: ${{ env.JF_URL }}
          username: ${{ secrets.ARTIFACTORY_USERNAME }}
          token: ${{ secrets.ARTIFACTORY_TOKEN }}
          maven_repo: ${{ needs.config.outputs.maven_repo }}
          project_dir: ${{ env.PROJECT_DIR }}
          download_repository: ${{ inputs.jfrog_cli_download_repo }}

      - name: Build with Maven
        uses: ./service/platform-ci/actions/build-maven
        with:
          project_dir: ${{ env.PROJECT_DIR }}
          maven_args: ${{ matrix.maven_args }}
          fail_on_test_failure: ${{ needs.config.outputs.fail_on_test_failure }}
          maven_log: ${{ env.MAVEN_LOG }}

      - name: Stage the application jar
        id: jar
        uses: ./service/platform-ci/actions/stage-jar
        with:
          project_dir: ${{ env.PROJECT_DIR }}

      - name: Smoke test the jar
        if: matrix.smoke_test
        uses: ./service/platform-ci/actions/smoke-test
        with:
          project_dir: ${{ env.PROJECT_DIR }}
          seconds: ${{ matrix.smoke_test_seconds }}

      - name: Enforce the coverage gate
        id: coverage
        uses: ./service/platform-ci/actions/coverage-gate
        with:
          project_dir: ${{ env.PROJECT_DIR }}
          min_coverage: ${{ needs.config.outputs.min_coverage }}
          enable_quality_gate: ${{ needs.config.outputs.enable_quality_gate }}
          force_continue_on_scan_failure: ${{ needs.config.outputs.force_continue_on_scan_failure }}

      - name: SonarQube analysis
        if: needs.config.outputs.sonar_scan == 'true'
        uses: ./service/platform-ci/actions/sonar-scan
        with:
          project_dir: ${{ env.PROJECT_DIR }}
          host_url: ${{ secrets.SONAR_HOST_URL }}
          token: ${{ secrets.SONAR_TOKEN }}
          project_key: ${{ needs.config.outputs.cmdb_code }}-${{ matrix.name }}
          enable_quality_gate: ${{ needs.config.outputs.enable_quality_gate }}
          force_continue_on_scan_failure: ${{ needs.config.outputs.force_continue_on_scan_failure }}

      - name: Copy configuration files
        if: matrix.configs_files_to_copy != '[]'
        uses: ./service/platform-ci/actions/copy-config-files
        with:
          project_dir: ${{ env.PROJECT_DIR }}
          files: ${{ matrix.configs_files_to_copy }}
          source_root: service/${{ inputs.service_path }}

      - name: Build and push the image
        id: push
        uses: ./service/platform-ci/actions/docker-build-push
        with:
          registry: ${{ needs.config.outputs.registry_host }}
          username: ${{ secrets.ARTIFACTORY_USERNAME }}
          password: ${{ secrets.ARTIFACTORY_TOKEN }}
          context: ${{ env.PROJECT_DIR }}/${{ matrix.docker_context }}
          dockerfile: ${{ env.PROJECT_DIR }}/${{ matrix.dockerfile }}
          image_base: ${{ matrix.image_base }}
          cmdb_code: ${{ needs.config.outputs.cmdb_code }}
          use_buildkit: ${{ matrix.use_buildkit }}

      - name: Publish build info
        uses: ./service/platform-ci/actions/publish-build-info
        with:
          project_dir: ${{ env.PROJECT_DIR }}
          git_dir: ${{ github.workspace }}/service

      - name: Stamp audit properties on the image
        if: always() && steps.push.outcome == 'success'
        uses: ./service/platform-ci/actions/stamp-properties
        with:
          docker_repo: ${{ needs.config.outputs.docker_repo }}
          image_name: ${{ matrix.docker_image_name }}
          cmdb_code: ${{ needs.config.outputs.cmdb_code }}
          sonar_scan: ${{ needs.config.outputs.sonar_scan }}
          build_name: ${{ env.JFROG_CLI_BUILD_NAME }}
          build_number: ${{ env.JFROG_CLI_BUILD_NUMBER }}

      - name: Write the build summary
        if: always()
        uses: ./service/platform-ci/actions/build-summary
        with:
          project_name: ${{ matrix.name }}
          result: ${{ job.status }}
          image: ${{ env.IMAGE_REF }}
          jar_source: ${{ steps.jar.outputs.source }}
          jar_size: ${{ steps.jar.outputs.size }}
          jdk_version: ${{ matrix.jdk_version }}
          coverage: ${{ steps.coverage.outputs.percent }}
          sonar_scan: ${{ needs.config.outputs.sonar_scan }}
          gates_source: ${{ needs.config.outputs.gates_source }}
          build_name: ${{ env.JFROG_CLI_BUILD_NAME }}
          build_number: ${{ env.JFROG_CLI_BUILD_NUMBER }}

  pages:
    name: Publish the report
    needs: [config, build]
    if: always() && needs.config.outputs.github_pages == 'true'
    runs-on: ${{ inputs.runner_label }}
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check out the service repository
        uses: actions/checkout@v4
        with:
          path: service
          fetch-depth: 1

      - name: Render the build report
        uses: ./service/platform-ci/actions/render-report
        with:
          output_dir: report
          service: ${{ inputs.service_path }}
          module_name: ${{ needs.config.outputs.module_name }}
          status: ${{ needs.build.result }}
          images: ${{ needs.config.outputs.images }}
          gates_source: ${{ needs.config.outputs.gates_source }}

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: report

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

  notify:
    name: Notify
    needs: [config, build]
    if: always()
    runs-on: ${{ inputs.runner_label }}
    env:
      SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
    steps:
      - name: Check out the service repository
        uses: actions/checkout@v4
        with:
          path: service
          fetch-depth: 1

      - name: Measure the run
        id: duration
        shell: bash
        env:
          STARTED_AT: ${{ needs.config.outputs.started_at }}
        run: |
          set -euo pipefail
          elapsed=$(( $(date +%s) - STARTED_AT ))
          printf 'text=%dm %02ds\n' $(( elapsed / 60 )) $(( elapsed % 60 )) >> "$GITHUB_OUTPUT"

      - name: Upsert the Port.io entity
        if: needs.config.outputs.port_enabled == 'true'
        uses: ./service/platform-ci/actions/port-entity
        with:
          client_id: ${{ secrets.PORT_CLIENT_ID }}
          client_secret: ${{ secrets.PORT_CLIENT_SECRET }}
          blueprint: ${{ needs.config.outputs.port_blueprint }}
          identifier: ${{ needs.config.outputs.cmdb_code }}
          title: ${{ needs.config.outputs.module_name }}
          status: ${{ needs.build.result }}
          image: ${{ needs.config.outputs.images }}

      - name: Send the build report
        if: needs.config.outputs.notify_email == 'true' && env.SMTP_SERVER != ''
        uses: ./service/platform-ci/actions/notify-email
        with:
          smtp_server: ${{ secrets.SMTP_SERVER }}
          smtp_username: ${{ secrets.SMTP_USERNAME }}
          smtp_password: ${{ secrets.SMTP_PASSWORD }}
          from_address: ${{ secrets.SMTP_FROM || 'ci-pipeline@corporate.io' }}
          recipients: ${{ needs.config.outputs.recipients }}
          status: ${{ needs.build.result }}
          service: ${{ needs.config.outputs.module_name }}
          image: ${{ needs.config.outputs.images }}
          duration: ${{ steps.duration.outputs.text }}