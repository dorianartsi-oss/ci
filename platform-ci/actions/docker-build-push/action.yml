name: Build and push the image
description: >
  Builds the container with BuildKit and pushes it to the Artifactory Docker registry,
  tagged with both the run number and the commit SHA. Replaces
  tasks/docker_build_buildkit.yaml and the community.docker.docker_login task.

inputs:
  registry:
    description: Docker registry host
    required: true
  username:
    description: Registry username
    required: true
  password:
    description: Registry password or access token
    required: true
  context:
    description: Build context directory
    required: true
  dockerfile:
    description: Path to the Dockerfile
    required: true
  image_base:
    description: Fully qualified image name without a tag
    required: true
  cmdb_code:
    description: CMDB code stamped as an image label
    required: true
  use_buildkit:
    description: Retained from build_config.json. The platform always builds with BuildKit.
    required: false
    default: 'true'

outputs:
  digest:
    description: Digest of the pushed image
    value: ${{ steps.push.outputs.digest }}
  tags:
    description: Comma-separated tags that were pushed
    value: ${{ steps.tags.outputs.list }}

runs:
  using: composite
  steps:
    - name: Confirm the build strategy
      shell: bash
      env:
        USE_BUILDKIT: ${{ inputs.use_buildkit }}
      run: |
        set -euo pipefail
        if [[ "$USE_BUILDKIT" != "true" ]]; then
          echo "::warning::project.use_buildkit is false, but this platform builds only with BuildKit. Continuing with BuildKit."
        fi

    - name: Resolve tags
      id: tags
      shell: bash
      env:
        IMAGE_BASE: ${{ inputs.image_base }}
      run: |
        set -euo pipefail
        echo "list=${IMAGE_BASE}:${GITHUB_RUN_NUMBER},${IMAGE_BASE}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

    - name: Set up Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to the registry
      uses: docker/login-action@v3
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}

    - name: Build and push
      id: push
      uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        platforms: linux/amd64
        push: true
        provenance: false
        tags: |
          ${{ inputs.image_base }}:${{ github.run_number }}
          ${{ inputs.image_base }}:${{ github.sha }}
        labels: |
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          io.corporate.cmdb-code=${{ inputs.cmdb_code }}
          io.corporate.build-number=${{ github.run_number }}