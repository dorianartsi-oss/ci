name: Resolve build config
description: >
  Deep-merges org defaults, the service's build_config.json, the central quality
  gates, and any workflow_dispatch overrides into a single effective config, and
  emits the resolved project as flat outputs. Precedence runs lowest to highest in
  that order, so central gates win and a team cannot lower a threshold set for it.

inputs:
  config_file:
    description: Path to the service's build_config.json
    required: true
  defaults_file:
    description: Path to org defaults. Blank = the copy shipped with this action.
    required: false
    default: ''
  gates_json:
    description: Compact JSON of resolved quality gates. Merged LAST so central gates win.
    required: false
    default: '{}'
  sonar_scan:
    description: "'true'/'false' to override scan.sonar_scan; blank to use the config"
    required: false
    default: ''

outputs:
  config:
    description: The full effective config as compact JSON
    value: ${{ steps.merge.outputs.config }}
  cmdb_code:
    value: ${{ steps.merge.outputs.cmdb_code }}
    description: Resolved CMDB code
  project_name:
    value: ${{ steps.merge.outputs.project_name }}
    description: The project's name
  project_path:
    value: ${{ steps.merge.outputs.project_path }}
    description: Directory containing the project, relative to the service root
  jdk_version:
    value: ${{ steps.merge.outputs.jdk_version }}
    description: JDK version to build with
  use_buildkit:
    value: ${{ steps.merge.outputs.use_buildkit }}
    description: Whether the image is built with BuildKit
  docker_image_name:
    value: ${{ steps.merge.outputs.docker_image_name }}
    description: Image name inside the Docker repository
  dockerfile:
    value: ${{ steps.merge.outputs.dockerfile }}
    description: Dockerfile path, relative to the project directory
  docker_context:
    value: ${{ steps.merge.outputs.docker_context }}
    description: Docker build context, relative to the project directory
  maven_args:
    value: ${{ steps.merge.outputs.maven_args }}
    description: Arguments passed to jf mvn
  smoke_test:
    value: ${{ steps.merge.outputs.smoke_test }}
    description: Whether to smoke-test the built jar
  smoke_test_seconds:
    value: ${{ steps.merge.outputs.smoke_test_seconds }}
    description: How long the smoke test must keep the app alive
  configs_files_to_copy:
    value: ${{ steps.merge.outputs.configs_files_to_copy }}
    description: JSON array of config files to copy into the build context
  image_base:
    value: ${{ steps.merge.outputs.image_base }}
    description: Fully qualified image name without a tag
  images:
    value: ${{ steps.merge.outputs.images }}
    description: image_base tagged with this run's number
  sonar_scan:
    value: ${{ steps.merge.outputs.sonar_scan }}
    description: Effective SonarQube toggle
  enable_quality_gate:
    value: ${{ steps.merge.outputs.enable_quality_gate }}
    description: Whether the quality gates are enforced at all
  force_continue_on_scan_failure:
    value: ${{ steps.merge.outputs.force_continue_on_scan_failure }}
    description: Report gate breaches without failing the build
  module_name:
    value: ${{ steps.merge.outputs.module_name }}
    description: Human-readable module name used in the email subject
  github_pages:
    value: ${{ steps.merge.outputs.github_pages }}
    description: Whether the build report is published to GitHub Pages
  port_enabled:
    value: ${{ steps.merge.outputs.port_enabled }}
    description: Whether the Port.io entity is upserted
  port_blueprint:
    value: ${{ steps.merge.outputs.port_blueprint }}
    description: Port.io blueprint identifier
  fail_on_test_failure:
    value: ${{ steps.merge.outputs.fail_on_test_failure }}
    description: Whether a failing unit test fails the build
  notify_email:
    value: ${{ steps.merge.outputs.notify_email }}
    description: Effective email-notification toggle
  recipients:
    value: ${{ steps.merge.outputs.recipients }}
    description: Comma-separated notification recipients
  registry_host:
    value: ${{ steps.merge.outputs.registry_host }}
    description: Artifactory host
  docker_repo:
    value: ${{ steps.merge.outputs.docker_repo }}
    description: Artifactory Docker repository key
  maven_repo:
    value: ${{ steps.merge.outputs.maven_repo }}
    description: Artifactory Maven virtual repository key

runs:
  using: composite
  steps:
    - name: Merge config
      id: merge
      shell: bash
      env:
        CONFIG_FILE: ${{ inputs.config_file }}
        DEFAULTS_IN: ${{ inputs.defaults_file }}
        GATES_JSON: ${{ inputs.gates_json }}
        SONAR_OVERRIDE: ${{ inputs.sonar_scan }}
      run: |
        set -euo pipefail

        defaults="${DEFAULTS_IN:-}"
        if [[ -z "$defaults" ]]; then
          defaults="$GITHUB_ACTION_PATH/../../defaults/build_config.defaults.json"
        fi
        for f in "$defaults" "$CONFIG_FILE"; do
          [[ -f "$f" ]] || { echo "::error::Missing config file: $f"; exit 1; }
          jq empty "$f" || { echo "::error::$f is not valid JSON"; exit 1; }
        done

        gates_file=$(mktemp)
        printf '%s' "${GATES_JSON:-}" > "$gates_file"
        [[ -s "$gates_file" ]] || printf '{}' > "$gates_file"
        jq empty "$gates_file" || { echo "::error::gates_json is not valid JSON"; exit 1; }

        # A plain object merges field-by-field through this same '*' operator, so
        # 'project' needs no separate defaulting pass the way an array of projects
        # once did.
        merged=$(jq -s '.[0] * .[1] * .[2]' "$defaults" "$CONFIG_FILE" "$gates_file")
        merged=$(jq 'del(._comment)' <<<"$merged")

        if [[ -n "$SONAR_OVERRIDE" ]]; then
          merged=$(jq --argjson v "$SONAR_OVERRIDE" '.scan.sonar_scan = $v' <<<"$merged")
        fi

        missing=$(jq -r '
          [ if (.project.name // "") == "" then "name" else empty end,
            if (.project.docker_image_name // "") == "" then "docker_image_name" else empty end ]
          | join(", ")
        ' <<<"$merged")
        if [[ -n "$missing" ]]; then
          echo "::error::$CONFIG_FILE's project is missing required field(s): $missing"
          exit 1
        fi

        project=$(jq -c '
          (.registry.host + (if (.registry.docker_repo // "") == "" then "" else "/" + .registry.docker_repo end)) as $prefix
          | .project
          | {
              name, type, language, builder,
              path: (.path // "."),
              jdk_version: (.jdk_version | tostring),
              use_buildkit, docker_image_name, dockerfile, docker_context,
              maven_args, smoke_test,
              smoke_test_seconds: (.smoke_test_seconds | tonumber),
              configs_files_to_copy: ((.configs_files_to_copy // []) | tojson),
              image_base: ($prefix + "/" + .docker_image_name)
            }
        ' <<<"$merged")

        image=$(jq -r --arg n "${GITHUB_RUN_NUMBER:-0}" '.image_base + ":" + $n' <<<"$project")

        {
          echo "config=$(jq -c . <<<"$merged")"
          echo "cmdb_code=$(jq -r '.cmdb_code' <<<"$merged")"
          echo "project_name=$(jq -r '.name' <<<"$project")"
          echo "project_path=$(jq -r '.path' <<<"$project")"
          echo "jdk_version=$(jq -r '.jdk_version' <<<"$project")"
          echo "use_buildkit=$(jq -r '.use_buildkit' <<<"$project")"
          echo "docker_image_name=$(jq -r '.docker_image_name' <<<"$project")"
          echo "dockerfile=$(jq -r '.dockerfile' <<<"$project")"
          echo "docker_context=$(jq -r '.docker_context' <<<"$project")"
          echo "maven_args=$(jq -r '.maven_args' <<<"$project")"
          echo "smoke_test=$(jq -r '.smoke_test' <<<"$project")"
          echo "smoke_test_seconds=$(jq -r '.smoke_test_seconds' <<<"$project")"
          echo "configs_files_to_copy=$(jq -r '.configs_files_to_copy' <<<"$project")"
          echo "image_base=$(jq -r '.image_base' <<<"$project")"
          echo "images=$image"
          echo "sonar_scan=$(jq -r '.scan.sonar_scan' <<<"$merged")"
          echo "enable_quality_gate=$(jq -r '.scan.enable_quality_gate // true' <<<"$merged")"
          echo "force_continue_on_scan_failure=$(jq -r '.scan.force_continue_on_scan_failure // false' <<<"$merged")"
          echo "module_name=$(jq -r 'if (.module_name // "") == "" then .cmdb_code else .module_name end' <<<"$merged")"
          echo "github_pages=$(jq -r '.notify.github_pages // false' <<<"$merged")"
          echo "port_enabled=$(jq -r '.port.enabled // false' <<<"$merged")"
          echo "port_blueprint=$(jq -r '.port.blueprint // "service"' <<<"$merged")"
          echo "fail_on_test_failure=$(jq -r '.tests.fail_on_test_failure // true' <<<"$merged")"
          echo "notify_email=$(jq -r '.notify.email' <<<"$merged")"
          echo "recipients=$(jq -r '(.notify.recipients // []) + [.owner_email // ""] | map(select(. != "")) | unique | join(",")' <<<"$merged")"
          echo "registry_host=$(jq -r '.registry.host' <<<"$merged")"
          echo "docker_repo=$(jq -r '.registry.docker_repo' <<<"$merged")"
          echo "maven_repo=$(jq -r '.registry.maven_repo' <<<"$merged")"
        } >> "$GITHUB_OUTPUT"

        echo "### Effective build config" >> "$GITHUB_STEP_SUMMARY"
        echo '```json' >> "$GITHUB_STEP_SUMMARY"
        jq . <<<"$merged" >> "$GITHUB_STEP_SUMMARY"
        echo '```' >> "$GITHUB_STEP_SUMMARY"

        rm -f "$gates_file"
