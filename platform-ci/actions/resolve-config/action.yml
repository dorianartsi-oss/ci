name: Resolve build config
description: >
  Deep-merges org defaults, the service's build_config.json, the central quality
  gates, and any workflow_dispatch overrides into a single effective config, and
  emits a build matrix over projects[]. Replaces create_json_file.py and the sed
  placeholder-substitution step (secrets are now injected as env at point of use,
  never written into JSON on disk).

inputs:
  config_file:
    description: Path to the service's build_config.json
    required: true
  defaults_file:
    description: Path to org defaults. Blank = the copy shipped with this action.
    required: false
    default: ''
  gates_json:
    description: Compact JSON of resolved quality gates. Merged LAST so central gates win.
    required: false
    default: '{}'
  sonar_scan:
    description: "'true'/'false' to override scan.sonar_scan; blank to use the config"
    required: false
    default: ''
  xray_scan:
    description: "'true'/'false' to override scan.xray_scan; blank to use the config"
    required: false
    default: ''

outputs:
  matrix:
    description: '{"include":[...]} — one entry per element of projects[]'
    value: ${{ steps.merge.outputs.matrix }}
  config:
    description: The full effective config as compact JSON
    value: ${{ steps.merge.outputs.config }}
  cmdb_code:
    value: ${{ steps.merge.outputs.cmdb_code }}
    description: Resolved CMDB code
  sonar_scan:
    value: ${{ steps.merge.outputs.sonar_scan }}
    description: Effective SonarQube toggle
  xray_scan:
    value: ${{ steps.merge.outputs.xray_scan }}
    description: Effective Xray toggle
  notify_email:
    value: ${{ steps.merge.outputs.notify_email }}
    description: Effective email-notification toggle
  recipients:
    value: ${{ steps.merge.outputs.recipients }}
    description: Comma-separated notification recipients
  registry_host:
    value: ${{ steps.merge.outputs.registry_host }}
    description: Artifactory host
  docker_repo:
    value: ${{ steps.merge.outputs.docker_repo }}
    description: Artifactory Docker repository key
  maven_repo:
    value: ${{ steps.merge.outputs.maven_repo }}
    description: Artifactory Maven virtual repository key

runs:
  using: composite
  steps:
    - name: Merge config
      id: merge
      shell: bash
      env:
        CONFIG_FILE: ${{ inputs.config_file }}
        DEFAULTS_IN: ${{ inputs.defaults_file }}
        GATES_JSON: ${{ inputs.gates_json }}
        SONAR_OVERRIDE: ${{ inputs.sonar_scan }}
        XRAY_OVERRIDE: ${{ inputs.xray_scan }}
      run: |
        set -euo pipefail

        defaults="${DEFAULTS_IN:-}"
        if [[ -z "$defaults" ]]; then
          defaults="$GITHUB_ACTION_PATH/../../defaults/build_config.defaults.json"
        fi
        for f in "$defaults" "$CONFIG_FILE"; do
          [[ -f "$f" ]] || { echo "::error::Missing config file: $f"; exit 1; }
          jq empty "$f" || { echo "::error::$f is not valid JSON"; exit 1; }
        done

        gates_file=$(mktemp)
        printf '%s' "${GATES_JSON:-}" > "$gates_file"
        [[ -s "$gates_file" ]] || printf '{}' > "$gates_file"
        jq empty "$gates_file" || { echo "::error::gates_json is not valid JSON"; exit 1; }

        # Precedence, lowest to highest: org defaults -> service config -> central
        # gates. Gates land last on purpose: a team must not be able to lower a
        # threshold the platform set for it.
        merged=$(jq -s '.[0] * .[1] * .[2]' "$defaults" "$CONFIG_FILE" "$gates_file")

        # Apply project_defaults to every project, then drop the template key.
        merged=$(jq '
          (.project_defaults // {}) as $pd
          | .projects |= map($pd * .)
          | del(.project_defaults, ._comment)
        ' <<<"$merged")

        # workflow_dispatch overrides win over everything.
        if [[ -n "$SONAR_OVERRIDE" ]]; then
          merged=$(jq --argjson v "$SONAR_OVERRIDE" '.scan.sonar_scan = $v' <<<"$merged")
        fi
        if [[ -n "$XRAY_OVERRIDE" ]]; then
          merged=$(jq --argjson v "$XRAY_OVERRIDE" '.scan.xray_scan = $v' <<<"$merged")
        fi

        count=$(jq '.projects | length' <<<"$merged")
        if [[ "$count" -eq 0 ]]; then
          echo "::error::$CONFIG_FILE declares no projects[] entries"
          exit 1
        fi

        missing=$(jq -r '
          [ .projects[] | select((.name // "") == "" or (.docker_image_name // "") == "") | (.name // "<unnamed>") ]
          | join(", ")
        ' <<<"$merged")
        if [[ -n "$missing" ]]; then
          echo "::error::projects[] entries missing name or docker_image_name: $missing"
          exit 1
        fi

        matrix=$(jq -c '{include: [ .projects[] | {
          name, type, language, builder,
          jdk_version: (.jdk_version | tostring),
          use_buildkit, docker_image_name, dockerfile, docker_context,
          maven_args, smoke_test,
          smoke_test_seconds: (.smoke_test_seconds | tonumber)
        } ]}' <<<"$merged")

        {
          echo "matrix=$matrix"
          echo "config=$(jq -c . <<<"$merged")"
          echo "cmdb_code=$(jq -r '.cmdb_code' <<<"$merged")"
          echo "sonar_scan=$(jq -r '.scan.sonar_scan' <<<"$merged")"
          echo "xray_scan=$(jq -r '.scan.xray_scan' <<<"$merged")"
          echo "notify_email=$(jq -r '.notify.email' <<<"$merged")"
          echo "recipients=$(jq -r '(.notify.recipients // []) + [.owner_email // ""] | map(select(. != "")) | unique | join(",")' <<<"$merged")"
          echo "registry_host=$(jq -r '.registry.host' <<<"$merged")"
          echo "docker_repo=$(jq -r '.registry.docker_repo' <<<"$merged")"
          echo "maven_repo=$(jq -r '.registry.maven_repo' <<<"$merged")"
        } >> "$GITHUB_OUTPUT"

        echo "### Effective build config" >> "$GITHUB_STEP_SUMMARY"
        echo '```json' >> "$GITHUB_STEP_SUMMARY"
        jq . <<<"$merged" >> "$GITHUB_STEP_SUMMARY"
        echo '```' >> "$GITHUB_STEP_SUMMARY"

        rm -f "$gates_file"


📑 TECHNICAL SPECIFICATION: ENTERPRISE CI/CD PIPELINE (ANSIBLE & GITHUB ACTIONS)
1. High-Level Architecture Overview
The system is an enterprise-grade, highly configurable Generic CI/CD Pipeline Engine designed for a secure, regulated financial environment (Bank).
Orchestrator: GitHub Actions (GHA) manages the workflow lifecycle, triggers, security parameter fetching, and runner allocation.
Execution Environment: GCP Self-Hosted Runners (private-gcp-runner) running within a private, air-gapped VPC [1].
Execution Engine: Ansible Playbooks and Roles executed locally on the GCP Runner via Python-generated commands [1].
Artifact & Container Registry: JFrog Artifactory (artifactory.corporate.io).
Security & Vulnerability Scanning: JFrog Xray (SCA), SonarQube (Code Quality), Checkmarx (SAST), and Mend/WhiteSource (Dependency Scanning).
Notification System: Email dispatch via Exchange Web Services (EWS).

2. Detailed Chronological Pipeline Flow (File-by-File & Step-by-Step)
Step 1: The Trigger & Entrypoint
File Name & Path: [Microservice-Repo]/.github/workflows/generic_pipeline_ci.yml
Trigger Mechanism: Triggers automatically on push to the master branch, or manually via workflow_dispatch (allowing inputs for branch_to_build_application, actions_ref, playbook_branch, and runner_label).
Job 1 (determine-branch): Evaluates if the run was manual or automatic. Uses Bash to output the target branch name to $GITHUB_OUTPUT.
Job 2 (reusable-workflow-call): Configures security permissions (id-token: write for secure GCP OIDC authentication and contents: read). Calls the centralized DevOps reusable workflow.
Variable Overrides: Dynamically disables security scans in local/dev test branches by injecting scan.sonar_scan=false, scan.checkmarx_scan=false, and scan.mend_scan=false under additional_params.

Step 2: The Project Configuration (The “DNA”)
File Name & Path: [Microservice-Repo]/build_config.json
Type: Custom homegrown configuration schema designed to decouple developers from writing GHA/Ansible code [1].
Key Fields (Java/Docker Microservice):
projects: An array allowing multi-module builds.
cmdb_code: Unique identifier (corp-cmdb-code) mapped to the bank’s Configuration Management Database (e.g., ServiceNow).
project.type: Set to "docker" (indicates the final artifact is a container).
project.language: Set to "java".
project.builder: Set to "maven".
project.use_buildkit: Set to true (enables Docker BuildKit features).
project.docker_image_name: Defines the target container name (payment-processor-service).

Step 3: The Centralized Orchestrator
File Name & Path: company-devops/company-actions/.github/workflows/global_pipeline_ci.yaml
Type: Reusable GitHub Actions Workflow.
Job 1 (Fetch-Gates):
Clones company-quality-gates/GlobalGates (private quality gates repo) [1].
Executes a Bash script parsing project-specific JSON rules or falling back to default.json using jq.
Extracts threshold variables for Mend, Checkmarx, SonarQube, and Unit Tests. Outputs them as a single multi-line string gates_params (e.g., scan.sonar.quality_gate.coverage=80).
Job 2 (Global-CI-Job):
Downloads three entities to the GCP Self-Hosted Runner workspace:
Microservice source code (to code/).
Ansible Playbook Engine repository (play/ from company-devops/GenericPipelineEngine).
DevOps Actions scripts (actions/ from company-devops/company-actions).
Calls the local composite action ./actions/company-actions/ansible/run-generic-ci.

Step 4: The Glue (Composite Action)
File Name & Path: company-devops/company-actions/ansible/run-generic-ci/action.yaml
Type: GitHub Actions Composite Action [1].
Step 1 (Clone company-actions repo): Performs a self-referencing clone of company-actions into a hidden directory .company-actions/ to lock in exact script versions [1].
Step 2 (Update JSON file): Executes create_json_file.py (Python 3). This script recursively merges build_config.json, the organization’s default parameter files, and the output of Fetch-Gates.
Step 3 (Replace placeholders in JSON): Executes a massive series of GNU sed commands [1]. Replaces placeholders inside the merged JSON (e.g., {{ secrets.ARTIFACTORY_USERNAME }}) with real, decrypted secrets exposed as GHA environment variables [1].
Step 4 (Run the Ansible Playbook): Executes build_ansible_command.py (Python 3) to formulate a strict ansible-playbook CLI call (handling debug flags, inventory host files, and the token parameter).
Step 5 (eval $COMMAND): Initiates the local Ansible runtime on the GCP Runner [1].

Step 5: Ansible Execution Entrypoint
File Name & Path: play/ansible-playbook/playbooks/ci_tasks_runner.yaml
Type: Ansible Playbook.
Logic: Evaluates if a target inventory host group exists. If empty, falls back to hosts: localhost (running directly on the GCP Runner).
Action: Loops through the projects array extracted from the JSON file and includes the core orchestration tasks from ../roles/ci_pipeline.yaml.

Step 6: Core Pipeline Lifecycle Tasks
File Name & Path: play/ansible-playbook/roles/ci_pipeline.yaml
Type: Ansible Tasks Orchestration Role [1].
Execution Logic: Decides which task files to load using Ansible conditional statements (when: blocks) mapped to build_config.json values [1].
Executed Tasks Sequence for the Java/Docker Microservice:
tasks/pre_build_tasks.yaml:
Detects OS family (Linux vs. Windows).
Deletes directories from prior builds to ensure stateless compilations.
Captures the Jerusalem timezone current timestamp (Asia/Jerusalem) and registers it as start_time for telemetry.
tasks/clone_repo.yaml: Performs an optimized Git clone of the microservice repo directly onto the GCP host.
tasks/jf_cli_config.yaml: Installs and authenticates the JFrog CLI on the host machine using Artifactory token credentials.
tasks/build_java.yaml (Java Build with JFrog CLI Maven):
Configures local Java environment variables matching the target JDK version (e.g., JDK 17).
Runs the Maven build wrapped inside JFrog CLI:
 timeout 120m jf mvn -B clean install -DskipTests=false -Ddependency-check.skip=true -e [2].
Why jf mvn? Integrates with Artifactory, resolves dependencies securely via the bank’s internal virtual repository (maven-virtual-registry), and logs downloaded dependencies to produce a “Build Info” manifest.
Dynamically locates the generated .jar artifact and renames/copies it to target/app.jar [2].
Performs a smoke test: runs timeout 10 java -jar target/app.jar [2]. If it survives 10 seconds (exit code 124), the application is verified as functionally ready.
Failure Diagnostic (Python Script): If compilation fails, runs an inline Python regex parser on /tmp/maven_build_output.txt. Calculates: missing = downloading_urls - downloaded_urls to output a precise list of packages that failed to download (extremely useful for debugging Air-Gap network/Artifactory blocks).
tasks/docker_build_buildkit.yaml:
Logs in to the JFrog container registry using community.docker.docker_login.
Triggers a fast Docker build utilizing the BuildKit daemon:
 docker buildx build --platform linux/amd64 -t artifactory.corporate.io/payment-processor-service:{run_number} --push -f ./Dockerfile .
Note: The Dockerfile uses a simple COPY target/app.jar app.jar to containerize the pre-compiled JAR.
tasks/set_properties_jfrog.yaml (always block):
Invokes the JFrog CLI: jf rt sp (Set Properties).
Attaches critical security and auditing metadata directly onto the Docker Image in Artifactory (e.g., scan.sonar_scan=false, git_commit_hash=${{ github.sha }}, build_timestamp). This metadata acts as an active gatekeeper for subsequent CD deployment stages.
tasks/summary.yaml (always block): Formulates a rich Markdown-based report showcasing build statistics and is rendered inside GHA’s Workflow Summary UI.
tasks/send_email_ews.yaml (always block): Integrates with Microsoft Exchange Web Services (EWS) to dispatch a HTML-formatted email to the triggering developer detailing run metrics and debugging links.

3. The Proposed Air-Gap Migration Strategy (Transition to Native GHA)
To remove the extreme overhead of Ansible, intermediate Python scripts, and dual-nested clones, a migration roadmap has been designed for the new banking-factory GitHub Organization [1].
Key Concept: “API-Contract Preservation”
The developer’s workflow interface (build_config.json) remains completely unchanged [1].
All Ansible Playbooks and Python orchestration scripts are deleted [1].
Steps are converted into native GitHub Actions workflows.
Air-Gap Action Mirroring Process:
Since the Bank operates in an offline, air-gapped VPC, external GHA Marketplace actions cannot be pulled at runtime [1].
The banking-factory DevOps team mirrors required open-source repositories to internal, vetted repos under the banking-factory GHA organization (e.g., banking-factory/setup-java).
External binaries (like JDKs and Node runtimes) are pre-uploaded to the local JFrog Artifactory. The mirrored actions are configured to pull assets from the local Artifactory rather than the public internet.
Mirrored Native Actions to be used:
SCM: banking-factory/actions-checkout@v4
JSON Parsing: Native jq command-line utility [1].
Java SDK & Maven Cache: banking-factory/setup-java@v4 (utilizing native cache: 'maven' to securely cache directories on the persistent GCP host) [1].
BuildKit setup: banking-factory/setup-buildx-action@v3
Artifactory Auth: banking-factory/docker-login-action@v3
Docker Build & Push: banking-factory/build-push-action@v6
JFrog CLI: banking-factory/setup-jfrog-cli@v4
Xray Compliance (failing on CVEs):
 Instead of manual API triggers, GHA executes:
 jf build-scan <build-name> <run-number>
 If Xray policies (configured via Web UI to “Fail build on violation”) are breached, GHA naturally halts the step with exit code 3.

