name: Build with Maven
description: >
  Validates the project layout, then runs the Maven build through the JFrog CLI so
  every resolved dependency is recorded into the build-info manifest. On failure it
  reports which artifacts Artifactory was asked for and never served, which is the
  decisive diagnostic on a restricted network. For docker+java services this covers
  the "jf mvn clean install" step of the combined build+sonar shell task in
  tasks/sonarqube.yaml; tasks/build_java.yaml is gated on type=="java" and never runs
  for type: docker. The workspace cleanup pre_build_tasks.yaml did is handled
  natively by actions/checkout, which runs git clean -ffdx.

inputs:
  project_dir:
    description: Directory containing the project's pom.xml
    required: true
  maven_args:
    description: Arguments passed to jf mvn
    required: true
  fail_on_test_failure:
    description: When 'false', failing tests are reported but do not fail the build
    required: false
    default: 'true'

outputs:
  missing_dependencies:
    description: Newline-separated artifacts Artifactory did not serve
    value: ${{ steps.diagnose.outputs.missing }}

runs:
  using: composite
  steps:
    - name: Validate the project layout
      shell: bash
      env:
        PROJECT_DIR: ${{ inputs.project_dir }}
      run: |
        set -euo pipefail
        if [[ ! -d "$PROJECT_DIR" ]]; then
          echo "::error::Project directory $PROJECT_DIR does not exist"
          exit 1
        fi
        if [[ ! -f "$PROJECT_DIR/pom.xml" ]]; then
          echo "::error::No pom.xml in $PROJECT_DIR"
          exit 1
        fi

    - name: Run the Maven build
      id: mvn
      shell: bash
      working-directory: ${{ inputs.project_dir }}
      env:
        MAVEN_ARGS_IN: ${{ inputs.maven_args }}
        FAIL_ON_TEST_FAILURE: ${{ inputs.fail_on_test_failure }}
      run: |
        set -euo pipefail
        args="$MAVEN_ARGS_IN"
        if [[ "$FAIL_ON_TEST_FAILURE" != "true" ]]; then
          args="$args -Dmaven.test.failure.ignore=true"
        fi
        echo "Running: jf mvn $args"
        set +e
        jf mvn $args 2>&1 | tee "$RUNNER_TEMP/maven_build_output.txt"
        status=${PIPESTATUS[0]}
        set -e
        exit "$status"

    - name: Diagnose unresolved dependencies
      id: diagnose
      if: failure() && steps.mvn.outcome == 'failure'
      shell: bash
      run: |
        set -uo pipefail
        log="$RUNNER_TEMP/maven_build_output.txt"
        [[ -f "$log" ]] || exit 0
        tmp=$(mktemp -d)
        grep -E 'Downloading from ' "$log" | grep -oE 'https?://[^ ]+' | sort -u > "$tmp/requested"
        grep -E 'Downloaded from '  "$log" | grep -oE 'https?://[^ ]+' | sort -u > "$tmp/received"
        missing=$(comm -23 "$tmp/requested" "$tmp/received")
        {
          echo "### Unresolved dependencies"
          echo
          if [[ -z "$missing" ]]; then
            echo "Every requested artifact was served. The failure is in compilation or tests, not the network."
          else
            echo "Artifactory did not serve these artifacts:"
            echo '```'
            echo "$missing"
            echo '```'
          fi
        } >> "$GITHUB_STEP_SUMMARY"
        {
          echo 'missing<<MISSING_EOF'
          echo "$missing"
          echo 'MISSING_EOF'
        } >> "$GITHUB_OUTPUT"
        if [[ -n "$missing" ]]; then
          echo "::error::Artifactory did not serve $(wc -l <<<"$missing") artifact(s); see the job summary."
        fi
        rm -rf "$tmp"
        exit 0