name: Enforce the coverage gate
description: >
  Reads the JaCoCo report and fails the build when line coverage is below the threshold
  the central quality-gates repository set for this CMDB code. The report-level LINE
  counter is the last one in the document, after all the per-package counters.
  Replaces tasks/quality_gates.yaml.

inputs:
  project_dir:
    description: Directory containing target/site/jacoco/jacoco.xml
    required: true
  min_coverage:
    description: Minimum line-coverage percentage
    required: false
    default: '0'
  enable_quality_gate:
    description: When 'false', coverage is reported but never enforced
    required: false
    default: 'true'
  force_continue_on_scan_failure:
    description: When 'true', a breach is reported as a warning instead of failing
    required: false
    default: 'false'

outputs:
  percent:
    description: Measured line coverage, or n/a when no report was produced
    value: ${{ steps.gate.outputs.percent }}

runs:
  using: composite
  steps:
    - name: Evaluate coverage
      id: gate
      shell: bash
      working-directory: ${{ inputs.project_dir }}
      env:
        MIN_COVERAGE: ${{ inputs.min_coverage }}
        ENABLE_GATE: ${{ inputs.enable_quality_gate }}
        FORCE_CONTINUE: ${{ inputs.force_continue_on_scan_failure }}
      run: |
        set -euo pipefail
        report=target/site/jacoco/jacoco.xml
        if [[ ! -f "$report" ]]; then
          echo "::warning::No JaCoCo report at $report; coverage gate skipped. Add the jacoco-maven-plugin to enforce it."
          echo "percent=n/a" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        counter=$(grep -o '<counter type="LINE"[^/]*/>' "$report" | tail -1)
        missed=$(sed -n 's/.*missed="\([0-9]*\)".*/\1/p' <<<"$counter")
        covered=$(sed -n 's/.*covered="\([0-9]*\)".*/\1/p' <<<"$counter")
        total=$(( missed + covered ))
        if [[ "$total" -eq 0 ]]; then
          echo "::warning::JaCoCo reported no instrumented lines; coverage gate skipped."
          echo "percent=n/a" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        pct=$(awk -v c="$covered" -v t="$total" 'BEGIN { printf "%.2f", (c * 100) / t }')
        echo "percent=$pct" >> "$GITHUB_OUTPUT"
        echo "Line coverage: ${pct}% (gate: ${MIN_COVERAGE}%)"
        echo "- Line coverage: **${pct}%** against a ${MIN_COVERAGE}% gate" >> "$GITHUB_STEP_SUMMARY"

        if awk -v p="$pct" -v m="$MIN_COVERAGE" 'BEGIN { exit (p + 0 >= m + 0) ? 0 : 1 }'; then
          exit 0
        fi

        if [[ "$ENABLE_GATE" != "true" ]]; then
          echo "::warning::Line coverage ${pct}% is below ${MIN_COVERAGE}% but scan.enable_quality_gate is false."
          exit 0
        fi
        if [[ "$FORCE_CONTINUE" == "true" ]]; then
          echo "::warning::Line coverage ${pct}% is below ${MIN_COVERAGE}% but scan.force_continue_on_scan_failure is true."
          exit 0
        fi
        echo "::error::Line coverage ${pct}% is below the ${MIN_COVERAGE}% gate for this CMDB code."
        exit 1