name: Prepare workspace
description: >
  Clears build output left by a previous run on a persistent self-hosted runner and
  asserts the project layout is buildable. The Maven cache is deliberately preserved.
  Replaces tasks/pre_build_tasks.yaml.

inputs:
  project_dir:
    description: Directory containing the project's pom.xml
    required: true
  maven_log:
    description: Absolute path of the Maven log this run will write
    required: true

runs:
  using: composite
  steps:
    - name: Clear previous build output
      shell: bash
      env:
        PROJECT_DIR: ${{ inputs.project_dir }}
        MAVEN_LOG: ${{ inputs.maven_log }}
      run: |
        set -euo pipefail
        rm -rf "$PROJECT_DIR/target"
        rm -f "$MAVEN_LOG"

    - name: Validate project layout
      shell: bash
      env:
        PROJECT_DIR: ${{ inputs.project_dir }}
      run: |
        set -euo pipefail
        if [[ ! -d "$PROJECT_DIR" ]]; then
          echo "::error::Project directory $PROJECT_DIR does not exist"
          exit 1
        fi
        if [[ ! -f "$PROJECT_DIR/pom.xml" ]]; then
          echo "::error::No pom.xml in $PROJECT_DIR"
          exit 1
        fi